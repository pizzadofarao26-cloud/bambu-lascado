<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel · Olho de Caranguejo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#540612">
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5ecd7; --surface:#fffaf0; --ink:#34110f; --muted:#79574e; --line:#e2d0b4; --soft:#eddfc4;
  --vinho:#540612; --casco:#d23c18; --casco-txt:#a8300f; --creme:#f8efdc; --sobre-casco:#fff8ec;
  --ok:#376a3a; --warn:#805300; --bad:#a3231f; --info:#375c78;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f0b0d; --surface:#2c1215; --ink:#f8efdc; --muted:#cfae9d; --line:#4b2527; --soft:#3a191c;
  --casco-txt:#f2977c; --ok:#93cf8f; --warn:#f0bd62; --bad:#ff9c8d; --info:#a7cbe6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f0b0d; --surface:#2c1215; --ink:#f8efdc; --muted:#cfae9d; --line:#4b2527; --soft:#3a191c;
  --casco-txt:#f2977c; --ok:#93cf8f; --warn:#f0bd62; --bad:#ff9c8d; --info:#a7cbe6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--vinho)}
a{color:var(--casco-txt)}
:focus-visible{outline:3px solid var(--casco);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.topo{background:var(--vinho);color:var(--creme);padding-top:env(safe-area-inset-top,0px)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700}
.marca img{width:34px;height:34px}
.topo button{background:none;border:1px solid rgba(248,239,220,.4);color:var(--creme);font:inherit;font-size:14px;padding:6px 12px;border-radius:10px;cursor:pointer}
input[type=email],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px}
.btn{border:0;background:var(--casco);color:var(--sobre-casco);font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.leve{background:transparent;color:var(--casco-txt);border:2px solid var(--line)}
.btn.perigo{background:transparent;color:var(--bad);border:2px solid var(--line)}
.entrar{max-width:420px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px}
.entrar h1{margin:0;font-size:26px}
.entrar p{margin:0;color:var(--muted)}
.msg{font-weight:600}
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding-block:22px 12px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--casco);background:color-mix(in srgb,var(--casco) 10%,var(--surface))}
.lista{display:grid;gap:14px;padding-bottom:48px}
.vazio{color:var(--muted);padding:32px 0;text-align:center}
.relato{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.relato header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.relato h2{margin:0;font-size:21px;line-height:1.2}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.tag.novo{background:var(--casco);color:var(--sobre-casco)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:0;padding:0;list-style:none}
.meta b{color:var(--muted);font-weight:600}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.fotos a{display:block;width:110px;height:110px;border-radius:10px;overflow:hidden;background:var(--soft)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.acoes textarea{flex:1 1 260px;min-height:42px;resize:vertical;font-size:14px}
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <div class="marca"><img src="../img/simbolo.png" alt="" width="34" height="34">Painel de relatos</div>
    <button type="button" id="sair" hidden>Sair</button>
  </div>
</header>

<main class="wrap">
  <form class="entrar" id="entrar" hidden>
    <h1>Entrar no painel</h1>
    <p>Só e-mails autorizados veem os relatos. Mandamos um link de acesso para o seu e-mail.</p>
    <input type="email" id="email" required autocomplete="email" placeholder="seu e-mail">
    <button class="btn" type="submit">Mandar link de acesso</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section id="painel" hidden>
    <div class="filtros" id="filtros"></div>
    <div class="lista" id="lista"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient("https://wuzrxxdvlksqjndkayym.supabase.co", "sb_publishable_mqcAQC7bGyIJ8WGT62sX7g_2qRj8Ygt");
const $ = id => document.getElementById(id);
const TIPOS = {denuncia: "Denúncia", obra: "Obra", servico: "Serviço público", sugestao: "Sugestão", elogio: "Elogio", outro: "Outro"};
const STATUS = {novo: "Novos", analisando: "Analisando", publicado: "Publicados", arquivado: "Arquivados"};
let filtro = "novo", relatos = [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const data = s => new Date(s).toLocaleString("pt-BR", {timeZone: "America/Bahia", dateStyle: "short", timeStyle: "short"});

$("entrar").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "Enviando…";
  const {error} = await db.auth.signInWithOtp({email: $("email").value.trim(), options: {emailRedirectTo: location.origin + "/painel/"}});
  $("msg").textContent = error ? "Não deu certo: " + error.message : "Pronto! Abra seu e-mail e toque no link (veja também o spam).";
});
$("sair").onclick = async () => { await db.auth.signOut(); location.reload(); };

db.auth.onAuthStateChange((_ev, sessao) => {
  $("entrar").hidden = !!sessao; $("painel").hidden = !sessao; $("sair").hidden = !sessao;
  if (sessao) setTimeout(carregar, 0);
});

async function carregar(){
  const {data: linhas, error} = await db.from("relatos").select("*").order("criado_em", {ascending: false}).limit(500);
  if (error) { $("lista").innerHTML = `<p class="vazio">Erro ao carregar: ${esc(error.message)}</p>`; return; }
  relatos = linhas;
  if (!relatos.length && !(await souAdmin())) {
    $("lista").innerHTML = `<p class="vazio">Este e-mail não tem acesso aos relatos.</p>`; $("filtros").innerHTML = ""; return;
  }
  desenhar();
}
async function souAdmin(){ const {data} = await db.from("admins").select("email").limit(1); return !!(data && data.length); }

function desenhar(){
  $("filtros").innerHTML = Object.entries(STATUS).map(([k, v]) =>
    `<button class="chip" type="button" data-f="${k}" aria-pressed="${k === filtro}">${v} (${relatos.filter(r => r.status === k).length})</button>`).join("");
  const L = relatos.filter(r => r.status === filtro);
  $("lista").innerHTML = L.length ? L.map(cartao).join("") : `<p class="vazio">Nada aqui por enquanto.</p>`;
  L.forEach(r => r.fotos.length && fotos(r));
}
function cartao(r){
  const meta = [["Onde", [r.local, r.bairro].filter(Boolean).join(" · ")], ["Quando", r.quando && r.quando.split("-").reverse().join("/")], ["Contato", r.contato]]
    .filter(([, v]) => v).map(([k, v]) => `<li><b>${k}:</b> ${esc(v)}</li>`).join("");
  return `<article class="relato" data-id="${r.id}">
    <header><span class="tag ${r.status === "novo" ? "novo" : ""}">${TIPOS[r.tipo] || r.tipo}</span><span>${data(r.criado_em)}</span><span>Protocolo ${r.id.slice(0, 8).toUpperCase()}</span></header>
    <h2>${esc(r.assunto)}</h2>
    <p class="desc">${esc(r.descricao)}</p>
    ${meta ? `<ul class="meta">${meta}</ul>` : ""}
    ${r.fotos.length ? `<div class="fotos" id="f-${r.id}">${r.fotos.map(() => "<a></a>").join("")}</div>` : ""}
    <div class="acoes">
      <textarea placeholder="Anotações da apuração (só a equipe vê)" data-nota>${esc(r.nota)}</textarea>
      <select data-status aria-label="Situação">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === r.status ? "selected" : ""}>${v.replace(/s$/, "")}</option>`).join("")}</select>
      <button class="btn" type="button" data-salvar>Salvar</button>
      <button class="btn perigo" type="button" data-apagar>Apagar</button>
    </div>
  </article>`;
}
async function fotos(r){
  const {data: urls} = await db.storage.from("relatos").createSignedUrls(r.fotos, 3600);
  const box = $("f-" + r.id); if (!box || !urls) return;
  box.innerHTML = urls.filter(u => u.signedUrl).map((u, i) => `<a href="${esc(u.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(u.signedUrl)}" alt="Foto ${i + 1} do relato" loading="lazy"></a>`).join("");
}

document.addEventListener("click", async e => {
  const f = e.target.closest("[data-f]");
  if (f) { filtro = f.dataset.f; desenhar(); return; }
  const card = e.target.closest(".relato"); if (!card) return;
  const r = relatos.find(x => x.id === card.dataset.id);
  if (e.target.matches("[data-salvar]")) {
    const novo = {status: card.querySelector("[data-status]").value, nota: card.querySelector("[data-nota]").value.trim() || null};
    e.target.textContent = "Salvando…";
    const {error} = await db.from("relatos").update(novo).eq("id", r.id);
    if (error) { e.target.textContent = "Erro"; return; }
    Object.assign(r, novo); desenhar();
  }
  if (e.target.matches("[data-apagar]")) {
    if (e.target.dataset.certeza !== "1") { e.target.dataset.certeza = "1"; e.target.textContent = "Toque de novo para apagar de vez"; return; }
    if (r.fotos.length) await db.storage.from("relatos").remove(r.fotos);
    const {error} = await db.from("relatos").delete().eq("id", r.id);
    if (!error) { relatos = relatos.filter(x => x !== r); desenhar(); }
  }
});
</script>
</body>
</html>
