# Roda o robô todo dia às 06:00 de Brasília (09:00 UTC), salva os dados no
# repositório e publica o site no GitHub Pages. Também dá para rodar na mão:
# aba Actions > "Robô diário" > Run workflow.
#
# O TCM-BA bloqueia acessos de fora do Brasil (os servidores do GitHub ficam
# nos EUA), então aqui ele é pulado. O TCM é atualizado a partir de um
# computador no Brasil com atualizar-tcm.ps1 (ou numa hospedagem brasileira).
name: Robô diário

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o robô
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: python -m robo --sem-tcm

      - name: Salvar novidades no repositório
        run: |
          git config user.name "robo-olho-de-caranguejo"
          git config user.email "robo@users.noreply.github.com"
          git add dados site
          git diff --cached --quiet || git commit -m "Robô: novidades de $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
